name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest (Server 2025 / VS 18) breaks the node-gyp VS detection
        # bundled with older Node; pin to windows-2022 for legacy coverage.
        os: [ubuntu-latest, macos-latest, windows-2022]
        node-version: [20, 22, 23, 24, 25, 26]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        # On Windows + Node 26 the install script source-builds the native
        # addon; Node 26's ThinLTO config makes node-gyp emit the lld-only
        # /opt:lldltojobs, which MSVC link.exe rejects (LNK1117). Force LTO off.
        env:
          npm_config_enable_thin_lto: 'false'
          npm_config_enable_lto: 'false'
        run: npm ci

      - name: Ensure systemd directory exists (Linux)
        if: runner.os == 'Linux'
        run: sudo mkdir -p /usr/lib/systemd/system

      - name: Run tests
        run: npm test
        shell: bash

  test-linux-initd:
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}-slim
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 23, 24, 25, 26]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies for init.d testing
        run: |
          apt-get update
          apt-get install -y sysvinit-utils procps git

      - name: Remove systemd to force init.d usage
        run: rm -rf /usr/lib/systemd/system /etc/systemd

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests (init.d)
        run: npm test
