# TEMPORARY — TM-3894 Windows prebuild gate. DELETE BEFORE MERGE.
#
# deploy.yml runs only on: release, so the Windows abi147 prebuild is
# unreachable from a PR — and it cannot be built on the macOS dev host. This
# builds it on windows-2022, asserts an abi147 binary is produced and loads,
# and uploads it. It NEVER publishes. Remove before merge.
name: TMP TM-3894 win prebuild gate

on:
  push:
    branches:
      - 'fix-#tm-3894/node-26-abi147-win32'

jobs:
  win-prebuild:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          architecture: x64

      - name: Install dependencies
        # Node 26's Windows binary is ThinLTO-built, so node-gyp would append the
        # lld-only /opt:lldltojobs to link.exe and break the MSVC build (LNK1117).
        env:
          npm_config_enable_thin_lto: 'false'
          npm_config_enable_lto: 'false'
        run: npm ci

      - name: Build Node 26 (abi147) prebuild
        env:
          npm_config_enable_thin_lto: 'false'
          npm_config_enable_lto: 'false'
        run: npx prebuildify --napi false --strip --target 26.8.1

      - name: Assert abi147 prebuild exists and loads
        shell: bash
        env:
          PREBUILDS_ONLY: '1'
        run: |
          set -euo pipefail
          ls -R prebuilds
          f=$(ls prebuilds/win32-x64/*abi147*.node 2>/dev/null || true)
          if [ -z "$f" ]; then echo "::error::no abi147 prebuild in prebuilds/win32-x64"; exit 1; fi
          echo "found: $f"
          # Confirm node-gyp-build resolves THIS prebuild for the running ABI
          # (no source fallback), i.e. the produced binary is correctly named.
          node -e "const p=require('node-gyp-build').path('.'); if(!/win32-x64/.test(p)||!/abi147/.test(p)){throw new Error('resolved wrong binding: '+p)} console.log('resolved', p, 'for abi', process.versions.modules)"

      - uses: actions/upload-artifact@v4
        with:
          name: tmp-tm3894-win-prebuilds
          path: prebuilds/
          if-no-files-found: error
